<text x="311" y="169" text-anchor="middle" font-size="10" font-weight="600" fill="#615a6e">Yes</text>
<path d="M155 200 L155 228" fill="none" stroke="#8f8a99" stroke-width="1.4" marker-end="url(#head)"/>
<text x="162" y="218" text-anchor="start" font-size="10" font-weight="600" fill="#615a6e">No</text>
<path d="M300 256 L321 256" fill="none" stroke="#8f8a99" stroke-width="1.4" marker-end="url(#head)"/>
<text x="311" y="249" text-anchor="middle" font-size="10" font-weight="600" fill="#615a6e">Yes</text>
<path d="M155 284 L155 312" fill="none" stroke="#8f8a99" stroke-width="1.4" marker-end="url(#head)"/>
<text x="162" y="302" text-anchor="start" font-size="10" font-weight="600" fill="#615a6e">No</text>
<path d="M300 336 L321 336" fill="none" stroke="#8f8a99" stroke-width="1.4" marker-end="url(#head)"/>
<text x="311" y="329" text-anchor="middle" font-size="10" font-weight="600" fill="#615a6e">Yes</text>
<path d="M155 360 L155 388" fill="none" stroke="#8f8a99" stroke-width="1.4" marker-end="url(#head)"/>
<text x="162" y="378" text-anchor="start" font-size="10" font-weight="600" fill="#615a6e">No</text>
<path d="M155 436 L155 464" fill="none" stroke="#8f8a99" stroke-width="1.4" marker-end="url(#head)"/>
<path d="M450 176 L460 176" fill="none" stroke="#8f8a99" stroke-width="1.4"/>
<path d="M450 256 L460 256" fill="none" stroke="#8f8a99" stroke-width="1.4"/>
<path d="M450 336 L460 336" fill="none" stroke="#8f8a99" stroke-width="1.4"/>
<path d="M460 176 L460 488 L301 488" fill="none" stroke="#8f8a99" stroke-width="1.4" marker-end="url(#head)"/>
<path d="M155 512 L155 540" fill="none" stroke="#8f8a99" stroke-width="1.4" marker-end="url(#head)"/>
<text x="10" y="606" font-size="10" fill="#615a6e">Ties: appointment first, then lower token. Staff can also Call now any waiting patient.</text>
<text x="10" y="620" font-size="10" fill="#615a6e">For the last patient, only Served and No-show are offered.</text>
