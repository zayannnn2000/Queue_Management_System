<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 470" width="470" height="470" role="img" aria-label="Call next decision: checked in, due now, earliest target, ties to appointments" font-family="Manrope, 'Segoe UI', Arial, sans-serif">
<title>Call next decision: checked in, due now, earliest target, ties to appointments</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#8f8a99"/></marker></defs>
<rect width="470" height="470" fill="#ffffff"/>
<rect x="10" y="10" width="290" height="40" rx="12" fill="#17141f" stroke="#17141f" stroke-width="1"/><text x="155" y="34.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Call next pressed</text>
<rect x="10" y="76" width="290" height="48" rx="12" fill="#efe8fa" stroke="#a98bd8" stroke-width="1"/><text x="155" y="98.25" text-anchor="middle" font-size="12" font-weight="700" fill="#3f2c63">Anyone checked in?</text><text x="155" y="111.25" text-anchor="middle" font-size="10" fill="#6a5591">Bookings not yet arrived are left out</text>
<rect x="322" y="76" width="138" height="48" rx="12" fill="#ffffff" stroke="#ddd5ea" stroke-width="1"/><text x="391" y="98.25" text-anchor="middle" font-size="12" font-weight="700" fill="#17141f">Counter stays free</text><text x="391" y="111.25" text-anchor="middle" font-size="10" fill="#615a6e">Nothing to call</text>
<rect x="10" y="152" width="290" height="48" rx="12" fill="#efe8fa" stroke="#a98bd8" stroke-width="1"/><text x="155" y="174.25" text-anchor="middle" font-size="12" font-weight="700" fill="#3f2c63">Anyone due now?</text><text x="155" y="187.25" text-anchor="middle" font-size="10" fill="#6a5591">Target time ≤ current time</text>
<rect x="322" y="152" width="138" height="60" rx="12" fill="#ffffff" stroke="#ddd5ea" stroke-width="1"/><text x="391" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#17141f">Call earliest</text><text x="391" y="187" text-anchor="middle" font-size="10" fill="#615a6e">upcoming target;</text><text x="391" y="200" text-anchor="middle" font-size="10" fill="#615a6e">keeps counter busy</text>
<rect x="10" y="228" width="290" height="48" rx="12" fill="#ffffff" stroke="#ddd5ea" stroke-width="1"/><text x="155" y="250.25" text-anchor="middle" font-size="12" font-weight="700" fill="#17141f">Call earliest target</text><text x="155" y="263.25" text-anchor="middle" font-size="10" fill="#615a6e">Tie: appointment first, then lower token</text>
<rect x="10" y="304" width="290" height="48" rx="12" fill="#ffffff" stroke="#ddd5ea" stroke-width="1"/><text x="155" y="326.25" text-anchor="middle" font-size="12" font-weight="700" fill="#17141f">Serving at counter</text><text x="155" y="339.25" text-anchor="middle" font-size="10" fill="#615a6e">Who was picked and why is shown</text>
<rect x="10" y="380" width="290" height="48" rx="12" fill="#ffffff" stroke="#ddd5ea" stroke-width="1"/><text x="155" y="402.25" text-anchor="middle" font-size="12" font-weight="700" fill="#17141f">Recompute all waits</text><text x="155" y="415.25" text-anchor="middle" font-size="10" fill="#615a6e">Display refreshes within 3 seconds</text>
<path d="M155 50 L155 76" fill="none" stroke="#8f8a99" stroke-width="1.4" marker-end="url(#head)"/>
<path d="M155 124 L155 152" fill="none" stroke="#8f8a99" stroke-width="1.4" marker-end="url(#head)"/>
<text x="162" y="142" text-anchor="start" font-size="10" font-weight="600" fill="#615a6e">Yes</text>
<path d="M300 100 L321 100" fill="none" stroke="#8f8a99" stroke-width="1.4" marker-end="url(#head)"/>
<text x="311" y="93" text-anchor="middle" font-size="10" font-weight="600" fill="#615a6e">No</text>
<path d="M155 200 L155 228" fill="none" stroke="#8f8a99" stroke-width="1.4" marker-end="url(#head)"/>
<text x="162" y="218" text-anchor="start" font-size="10" font-weight="600" fill="#615a6e">Yes</text>
<path d="M300 176 L321 176" fill="none" stroke="#8f8a99" stroke-width="1.4" marker-end="url(#head)"/>
<text x="311" y="169" text-anchor="middle" font-size="10" font-weight="600" fill="#615a6e">No</text>
<path d="M155 276 L155 304" fill="none" stroke="#8f8a99" stroke-width="1.4" marker-end="url(#head)"/>
<path d="M391 212 L391 328 L301 328" fill="none" stroke="#8f8a99" stroke-width="1.4" marker-end="url(#head)"/>
<path d="M155 352 L155 380" fill="none" stroke="#8f8a99" stroke-width="1.4" marker-end="url(#head)"/>
<text x="10" y="456" font-size="10" fill="#615a6e">For the last patient, only Served and No-show are offered: there is nobody to call next.</text>
</svg>
