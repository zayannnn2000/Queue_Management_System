<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 628" width="470" height="628" role="img" aria-label="Call next decision for one room: priority, due appointments and protected walk-ins, other due walk-ins, else the earliest upcoming" font-family="Manrope, 'Segoe UI', Arial, sans-serif">
<title>Call next decision for one room: priority, due appointments and protected walk-ins, other due walk-ins, else the earliest upcoming</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#8f8a99"/></marker></defs>
<rect width="470" height="628" fill="#ffffff"/>
<rect x="10" y="10" width="290" height="40" rx="12" fill="#17141f" stroke="#17141f" stroke-width="1"/><text x="155" y="34.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">A room presses Call next</text>
<rect x="10" y="76" width="290" height="48" rx="12" fill="#efe8fa" stroke="#a98bd8" stroke-width="1"/><text x="155" y="98.25" text-anchor="middle" font-size="12" font-weight="700" fill="#3f2c63">Nobody waiting for this service?</text><text x="155" y="111.25" text-anchor="middle" font-size="10" fill="#6a5591">Bookings not yet arrived are left out</text>
<rect x="322" y="76" width="128" height="48" rx="12" fill="#ffffff" stroke="#ddd5ea" stroke-width="1"/><text x="386" y="98.25" text-anchor="middle" font-size="12" font-weight="700" fill="#17141f">Room stays free</text><text x="386" y="111.25" text-anchor="middle" font-size="10" fill="#615a6e">Nothing to call</text>
<rect x="10" y="152" width="290" height="48" rx="12" fill="#efe8fa" stroke="#a98bd8" stroke-width="1"/><text x="155" y="174.25" text-anchor="middle" font-size="12" font-weight="700" fill="#3f2c63">A priority patient waiting?</text><text x="155" y="187.25" text-anchor="middle" font-size="10" fill="#6a5591">Flagged by staff, with a reason</text>
<rect x="322" y="152" width="128" height="48" rx="12" fill="#ffffff" stroke="#ddd5ea" stroke-width="1"/><text x="386" y="174.25" text-anchor="middle" font-size="12" font-weight="700" fill="#17141f">Earliest flagged</text><text x="386" y="187.25" text-anchor="middle" font-size="10" fill="#615a6e">Elderly, Urgent, …</text>
<rect x="10" y="228" width="290" height="56" rx="12" fill="#efe8fa" stroke="#a98bd8" stroke-width="1"/><text x="155" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#3f2c63">Due appointment or protected walk-in?</text><text x="155" y="261" text-anchor="middle" font-size="10" fill="#6a5591">Booked time reached, or a walk-in</text><text x="155" y="274" text-anchor="middle" font-size="10" fill="#6a5591">who has waited 30+ min</text>
<rect x="322" y="232" width="128" height="48" rx="12" fill="#ffffff" stroke="#ddd5ea" stroke-width="1"/><text x="386" y="254.25" text-anchor="middle" font-size="12" font-weight="700" fill="#17141f">Earliest target</text><text x="386" y="267.25" text-anchor="middle" font-size="10" fill="#615a6e">of these</text>
<rect x="10" y="312" width="290" height="48" rx="12" fill="#efe8fa" stroke="#a98bd8" stroke-width="1"/><text x="155" y="334.25" text-anchor="middle" font-size="12" font-weight="700" fill="#3f2c63">Another walk-in due?</text><text x="155" y="347.25" text-anchor="middle" font-size="10" fill="#6a5591">Target ≤ now (arrival, or +15 min hold)</text>
<rect x="322" y="312" width="128" height="48" rx="12" fill="#ffffff" stroke="#ddd5ea" stroke-width="1"/><text x="386" y="334.25" text-anchor="middle" font-size="12" font-weight="700" fill="#17141f">Earliest target</text><text x="386" y="347.25" text-anchor="middle" font-size="10" fill="#615a6e">of these</text>
<rect x="10" y="388" width="290" height="48" rx="12" fill="#ffffff" stroke="#ddd5ea" stroke-width="1"/><text x="155" y="410.25" text-anchor="middle" font-size="12" font-weight="700" fill="#17141f">Earliest upcoming target</text><text x="155" y="423.25" text-anchor="middle" font-size="10" fill="#615a6e">Nobody due: the room isn't left idle</text>
<rect x="10" y="464" width="290" height="48" rx="12" fill="#ffffff" stroke="#ddd5ea" stroke-width="1"/><text x="155" y="486.25" text-anchor="middle" font-size="12" font-weight="700" fill="#17141f">Being seen in the room</text><text x="155" y="499.25" text-anchor="middle" font-size="10" fill="#615a6e">Who was picked and why is shown</text>
<rect x="10" y="540" width="290" height="48" rx="12" fill="#ffffff" stroke="#ddd5ea" stroke-width="1"/><text x="155" y="562.25" text-anchor="middle" font-size="12" font-weight="700" fill="#17141f">Recompute waits per service</text><text x="155" y="575.25" text-anchor="middle" font-size="10" fill="#615a6e">Display refreshes within 3 seconds</text>
